<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesyweb ERP — Gestión de Reformas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row">

  <!-- Menú lateral -->
  <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-amber-500">Gesyweb</h1>
      <p class="text-xs text-slate-400 mt-1">Control de Obras y Reformas</p>
      
      <nav class="mt-8 space-y-2">
        <a href="#proyectos" class="block px-4 py-2.5 rounded-lg bg-slate-800 text-white font-medium">Proyectos</a>
        <a href="#incidencias" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">Incidencias</a>
        <a href="#herramientas" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">Herramientas</a>
        <a href="#operarios" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">Operarios</a>
      </nav>
    </div>

    <div class="mt-8 pt-4 border-t border-slate-800 text-xs text-slate-500">
      Sesión iniciada
    </div>
  </aside>

  <!-- Panel principal -->
  <main class="flex-1 p-6 md:p-10">
    <header class="flex justify-between items-center pb-6 border-b border-slate-200">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">Proyectos Activos</h2>
        <p class="text-sm text-slate-500">Supervisa las obras en curso y el estado de los tajos.</p>
      </div>
      <button class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-lg shadow-sm transition">
        + Nueva Obra
      </button>
    </header>

    <!-- Listado inicial -->
    <section class="mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 mb-3">En curso</span>
        <h3 class="text-lg font-bold text-slate-900">Reforma Integral C/ Mayor</h3>
        <p class="text-sm text-slate-500 mt-1">Demolición de tabiquería y fontanería.</p>
        <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between text-xs text-slate-400">
          <span>Operarios: 3</span>
          <span>Incidencias: 0</span>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
