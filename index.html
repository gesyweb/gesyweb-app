<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesyweb ERP — Gestión de Reformas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row">

  <!-- Menú lateral -->
  <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-amber-500">Gesyweb</h1>
      <p class="text-xs text-slate-400 mt-1">Control de Obras y Reformas</p>
      
      <nav class="mt-8 space-y-2">
        <a href="#proyectos" class="block px-4 py-2.5 rounded-lg bg-slate-800 text-white font-medium">Proyectos</a>
        <a href="#incidencias" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">Incidencias</a>
        <a href="#herramientas" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">Herramientas</a>
        <a href="#operarios" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white">Operarios</a>
      </nav>
    </div>

    <div class="mt-8 pt-4 border-t border-slate-800 text-xs text-slate-500">
      Estado: <span id="db-status" class="text-amber-400 font-medium">Conectando...</span>
    </div>
  </aside>

  <!-- Panel principal -->
  <main class="flex-1 p-6 md:p-10">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-200 gap-4">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">Proyectos Activos</h2>
        <p class="text-sm text-slate-500">Supervisa las obras en curso registradas en la nube.</p>
      </div>
      
      <!-- Formulario para añadir obra rápida -->
      <div class="flex gap-2 w-full md:w-auto">
        <input id="nuevo-nombre-obra" type="text" placeholder="Nombre de nueva obra..." class="px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 flex-1">
        <button id="btn-crear-obra" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 text-sm rounded-lg shadow-sm transition">
          + Añadir Obra
        </button>
      </div>
    </header>

    <!-- Listado dinámico de obras -->
    <section id="lista-proyectos" class="mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-sm text-slate-400">Cargando proyectos desde Firestore...</p>
    </section>
  </main>

  <!-- Conexión Firebase Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Configuración oficial de tu proyecto gesyweb
    const firebaseConfig = {
      apiKey: "AIzaSyDerRNJAbwBr8G7sjp7guj3HmKBBh0S6UE",
      authDomain: "gesyweb-2d8f6.firebaseapp.com",
      projectId: "gesyweb-2d8f6",
      storageBucket: "gesyweb-2d8f6.firebasestorage.app",
      messagingSenderId: "813863962923",
      appId: "1:813863962923:web:b43d2dc67ff6acdd86dd6e",
      measurementId: "G-YWF06XCFZL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusEl = document.getElementById("db-status");
    const listaEl = document.getElementById("lista-proyectos");
    const inputObra = document.getElementById("nuevo-nombre-obra");
    const btnCrear = document.getElementById("btn-crear-obra");

    statusEl.textContent = "Conectado a Firestore";
    statusEl.className = "text-emerald-400 font-medium";

    // Escuchar proyectos en tiempo real
    const colRef = collection(db, "proyectos");
    onSnapshot(colRef, (snapshot) => {
      listaEl.innerHTML = "";
      if (snapshot.empty) {
        listaEl.innerHTML = `<div class="p-6 bg-white rounded-xl border border-slate-200 text-sm text-slate-500 col-span-full">No hay proyectos registrados aún. Escribe el nombre arriba y pulsa '+ Añadir Obra'.</div>`;
        return;
      }
      snapshot.forEach((doc) => {
        const data = doc.data();
        const card = document.createElement("div");
        card.className = "bg-white p-6 rounded-xl border border-slate-200 shadow-sm";
        card.innerHTML = `
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 mb-3">En curso</span>
          <h3 class="text-lg font-bold text-slate-900">${data.nombre || 'Sin título'}</h3>
          <p class="text-sm text-slate-500 mt-1">${data.descripcion || 'Sin descripción adicional.'}</p>
          <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between text-xs text-slate-400">
            <span>ID: ${doc.id.substring(0, 6)}</span>
            <span>Activo</span>
          </div>
        `;
        listaEl.appendChild(card);
      });
    }, (error) => {
      statusEl.textContent = "Error al conectar";
      statusEl.className = "text-rose-400 font-medium";
      console.error(error);
    });

    // Guardar nueva obra
    btnCrear.addEventListener("click", async () => {
      const nombre = inputObra.value.trim();
      if (!nombre) return;
      btnCrear.disabled = true;
      btnCrear.textContent = "Guardando...";
      try {
        await addDoc(colRef, {
          nombre: nombre,
          descripcion: "Obra registrada desde el panel de control.",
          fechaCreacion: serverTimestamp()
        });
        inputObra.value = "";
      } catch (e) {
        alert("Error al guardar: " + e.message);
      } finally {
        btnCrear.disabled = false;
        btnCrear.textContent = "+ Añadir Obra";
      }
    });
  </script>
</body>
</html>
