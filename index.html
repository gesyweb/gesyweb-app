<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesyweb ERP — Gestión de Reformas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row">

  <!-- Menú lateral -->
  <aside class="w-full md:w-64 bg-slate-900 text-white p-6 flex flex-col justify-between shrink-0">
    <div>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center font-black text-slate-950">G</div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white leading-tight">Gesyweb</h1>
          <p class="text-xs text-slate-400">Control de Obras y Reformas</p>
        </div>
      </div>
      
      <nav class="mt-8 space-y-2">
        <a href="#proyectos" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-slate-800 text-white font-medium">
          <span>🏗️</span> Proyectos
        </a>
        <a href="#incidencias" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
          <span>⚠️</span> Incidencias
        </a>
        <a href="#herramientas" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
          <span>🔨</span> Herramientas
        </a>
        <a href="#operarios" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
          <span>👷</span> Operarios
        </a>
      </nav>
    </div>

    <div class="mt-8 pt-4 border-t border-slate-800 text-xs text-slate-400 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
      <span id="db-status">Conectando...</span>
    </div>
  </aside>

  <!-- Panel principal -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto">
    <!-- Cabecera -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-200 gap-4">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">Obras y Proyectos</h2>
        <p class="text-sm text-slate-500">Gestiona las reformas, presupuestos y estados en tiempo real.</p>
      </div>
      
      <button id="btn-abrir-modal" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2.5 rounded-lg shadow-sm transition flex items-center gap-2">
        <span>+</span> Nueva Obra
      </button>
    </header>

    <!-- Listado dinámico de obras -->
    <section id="lista-proyectos" class="mt-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-sm text-slate-400">Cargando proyectos desde Firestore...</p>
    </section>
  </main>

  <!-- Ventana Modal: Alta de Nueva Obra -->
  <div id="modal-obra" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 sm:p-8 max-w-lg w-full shadow-2xl">
      <div class="flex justify-between items-center pb-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900">Registrar Nueva Obra</h3>
        <button id="btn-cerrar-modal" class="text-slate-400 hover:text-slate-700 font-bold text-xl">&times;</button>
      </div>

      <form id="form-nueva-obra" class="mt-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre o Dirección de la Obra *</label>
          <input id="input-nombre" type="text" required placeholder="Ej. Reforma Baño y Cocina C/ Mayor 12" class="w-full px-3.5 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Cliente / Contacto</label>
            <input id="input-cliente" type="text" placeholder="Ej. Juan Pérez (612345678)" class="w-full px-3.5 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Presupuesto (€)</label>
            <input id="input-presupuesto" type="number" placeholder="Ej. 8500" class="w-full px-3.5 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Estado de la Obra</label>
          <select id="input-estado" class="w-full px-3.5 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none bg-white">
            <option value="En curso">🟢 En curso</option>
            <option value="Presupuestada">🟡 Presupuestada / Pendiente</option>
            <option value="Finalizada">🔵 Finalizada</option>
          </select>
        </div>

        <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" id="btn-cancelar" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancelar</button>
          <button type="submit" id="btn-guardar" class="px-5 py-2 text-sm bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg shadow-sm transition">Guardar Obra</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Conexión Firebase Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDerRNJAbwBr8G7sjp7guj3HmKBBh0S6UE",
      authDomain: "gesyweb-2d8f6.firebaseapp.com",
      projectId: "gesyweb-2d8f6",
      storageBucket: "gesyweb-2d8f6.firebasestorage.app",
      messagingSenderId: "813863962923",
      appId: "1:813863962923:web:b43d2dc67ff6acdd86dd6e",
      measurementId: "G-YWF06XCFZL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusEl = document.getElementById("db-status");
    const listaEl = document.getElementById("lista-proyectos");
    const modal = document.getElementById("modal-obra");
    const form = document.getElementById("form-nueva-obra");
    const btnGuardar = document.getElementById("btn-guardar");

    // Control de la ventana modal
    document.getElementById("btn-abrir-modal").addEventListener("click", () => modal.classList.replace("hidden", "flex"));
    document.getElementById("btn-cerrar-modal").addEventListener("click", () => modal.classList.replace("flex", "hidden"));
    document.getElementById("btn-cancelar").addEventListener("click", () => modal.classList.replace("flex", "hidden"));

    // Conexión y lectura en tiempo real
    const colRef = collection(db, "proyectos");
    onSnapshot(colRef, (snapshot) => {
      statusEl.textContent = "Conectado a Firestore";
      statusEl.parentElement.querySelector("span").className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
      listaEl.innerHTML = "";

      if (snapshot.empty) {
        listaEl.innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center">
            <span class="text-4xl">🏗️</span>
            <p class="text-base font-semibold text-slate-800 mt-2">No hay obras registradas</p>
            <p class="text-xs text-slate-400 mt-1">Haz clic en '+ Nueva Obra' para dar de alta tu primera reforma.</p>
          </div>`;
        return;
      }

      snapshot.forEach((doc) => {
        const d = doc.data();
        let badgeColor = "bg-emerald-100 text-emerald-800";
        if (d.estado === "Presupuestada") badgeColor = "bg-amber-100 text-amber-800";
        if (d.estado === "Finalizada") badgeColor = "bg-sky-100 text-sky-800";

        const card = document.createElement("div");
        card.className = "bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between hover:shadow-md transition";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${badgeColor}">
                ${d.estado || 'En curso'}
              </span>
              <span class="text-xs font-bold text-slate-700">${d.presupuesto ? Number(d.presupuesto).toLocaleString('es-ES') + ' €' : 'Sin ppto.'}</span>
            </div>
            <h3 class="text-base font-bold text-slate-900 leading-snug">${d.nombre}</h3>
            <p class="text-xs text-slate-500 mt-2">👤 ${d.cliente || 'Cliente no asignado'}</p>
          </div>
          
          <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
            <span>Ref: ${doc.id.substring(0, 5).toUpperCase()}</span>
            <button class="text-amber-600 font-semibold hover:underline">Ver detalles →</button>
          </div>
        `;
        listaEl.appendChild(card);
      });
    }, (err) => {
      statusEl.textContent = "Error de conexión";
      statusEl.parentElement.querySelector("span").className = "w-2 h-2 rounded-full bg-rose-500 inline-block";
      console.error(err);
    });

    // Guardar obra
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardando...";

      try {
        await addDoc(colRef, {
          nombre: document.getElementById("input-nombre").value.trim(),
          cliente: document.getElementById("input-cliente").value.trim(),
          presupuesto: document.getElementById("input-presupuesto").value,
          estado: document.getElementById("input-estado").value,
          fechaCreacion: serverTimestamp()
        });

        form.reset();
        modal.classList.replace("flex", "hidden");
      } catch (error) {
        alert("Error al registrar obra: " + error.message);
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "Guardar Obra";
      }
    });
  </script>
</body>
</html>
